<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Photos and videos · Silver King Mine, Calico</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="97 photos and 5 videos from the 24 March 2019 CSUSB geology field camp at the Silver King Mine.">
<style>
html,body{margin:0;background:#050403;color:#e8d8c4;font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif}
body{padding:18px 16px 64px}
main{width:min(1040px,100%);margin:0 auto}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:700;color:#f3c79a}
.deck{margin:0 0 16px;font-size:17px;line-height:1.45;max-width:68ch}
.back{display:inline-block;margin:0 0 16px;padding:14px 18px;border:2px solid #d7fffb;border-radius:12px;background:#0f9d9a;color:#04221f;font-size:18px;font-weight:800;text-decoration:none}
.back:hover{background:#0c7f7c;color:#f3fffd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.grid button{appearance:none;position:relative;padding:0;border:1px solid #3a2a1e;border-radius:10px;background:#0a0705;cursor:pointer;overflow:hidden;color:inherit}
.grid button img{display:block;width:100%;height:168px;object-fit:cover}
.grid button.vid{border:4px solid #0f9d9a;box-shadow:0 0 0 2px rgba(15,157,154,.35)}
.badge{position:absolute;top:8px;left:8px;background:#0f9d9a;color:#04221f;font:800 13px/1 system-ui,sans-serif;letter-spacing:.06em;padding:5px 7px;border-radius:5px}
.play{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:rgba(4,34,31,.72);color:#f3fffd;border:3px solid #0f9d9a;font-size:28px;line-height:52px;text-align:center}
.tilecap{display:block;padding:6px 8px 8px;font-size:13px;line-height:1.3;text-align:left;color:#f0d2b0}
#lb{position:fixed;inset:0;z-index:30;background:rgba(5,4,3,.94);display:flex;align-items:center;justify-content:center;padding:72px 88px 84px;box-sizing:border-box;touch-action:none}
#lb[hidden]{display:none}
#lb .stage{max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
#lb img,#lb video{max-width:min(1100px,100%);max-height:min(78vh,100%);border-radius:8px;background:#000}
#lb video{border:4px solid #0f9d9a}
#lb .x,#lb .nav{position:absolute;border:3px solid #fff;background:#0f9d9a;color:#04221f;font-weight:800;cursor:pointer;border-radius:50%}
#lb .x{top:14px;right:14px;width:56px;height:56px;border-radius:14px;font:800 18px/1 system-ui,sans-serif}
#lb .nav{top:50%;width:72px;height:72px;transform:translateY(-50%);font-size:46px;line-height:1}
#lb .prev{left:12px}
#lb .next{right:12px}
#lb .x:hover,#lb .nav:hover{background:#0c7f7c;color:#f3fffd}
#lb .meta{position:absolute;left:16px;right:16px;bottom:14px;text-align:center}
#lb .count{margin:0;font-size:18px;font-weight:800;color:#f3fffd}
#lb .cap{margin:4px 0 0;font-size:16px;line-height:1.35;color:#f0d2b0}
@media(max-width:700px){
 .grid{grid-template-columns:1fr 1fr}
 .grid button img{height:140px}
 #lb{padding:64px 8px 88px}
 #lb .nav{width:56px;height:56px;font-size:34px}
 #lb .prev{left:6px}
 #lb .next{right:6px}
}
</style></head>
<body>
<main>
<a class="back" href="index.html#photos">Back to the main page</a>
<h1>Photos and videos from the day</h1>
<p class="deck" id="deck">97 photos and 5 videos from the CSUSB geology field camp at the Silver King Mine, 24 March 2019. Select a picture to see it larger. Videos are marked VIDEO.</p>
<div class="grid" id="grid"></div>
</main>
<div id="lb" hidden>
<button type="button" class="x" aria-label="Close">Close</button>
<button type="button" class="nav prev" aria-label="Previous">&#8249;</button>
<button type="button" class="nav next" aria-label="Next">&#8250;</button>
<div class="stage" id="stage"></div>
<div class="meta"><p class="count" id="count"></p><p class="cap" id="cap"></p></div>
</div>
<script>
(function(){
'use strict';
var items=[], index=0, startX=null, startY=null;
var grid=document.getElementById('grid');
var lb=document.getElementById('lb');
var stage=document.getElementById('stage');
var countEl=document.getElementById('count');
var capEl=document.getElementById('cap');
function posterFor(file){
  var m=/video_(\d+)/.exec(file||'');
  return m ? 'videos/poster_'+m[1]+'.jpg' : '';
}
function srcFor(item){
  if(item.type==='video') return item.file;
  return 'photos/'+item.file;
}
function show(i){
  if(!items.length) return;
  index=(i+items.length)%items.length;
  var item=items[index];
  var prev=stage.querySelector('video');
  if(prev) prev.pause();
  stage.innerHTML='';
  if(item.type==='video'){
    var v=document.createElement('video');
    v.controls=true; v.preload='metadata'; v.playsInline=true; v.setAttribute('playsinline','');
    v.poster=posterFor(item.file);
    v.src=srcFor(item);
    stage.appendChild(v);
  } else {
    var img=document.createElement('img');
    img.src=srcFor(item);
    img.alt=item.caption||'Field photo';
    stage.appendChild(img);
  }
  countEl.textContent=(index+1)+' / '+items.length;
  capEl.textContent=item.caption||'';
  lb.hidden=false;
  document.body.style.overflow='hidden';
  if(location.hash!=='#i'+index) history.replaceState(null,'','#i'+index);
}
function shut(){
  var v=stage.querySelector('video');
  if(v) v.pause();
  lb.hidden=true;
  stage.innerHTML='';
  document.body.style.overflow='';
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
}
document.querySelector('#lb .x').addEventListener('click', shut);
document.querySelector('#lb .prev').addEventListener('click', function(){ show(index-1); });
document.querySelector('#lb .next').addEventListener('click', function(){ show(index+1); });
lb.addEventListener('click', function(e){ if(e.target===lb) shut(); });
document.addEventListener('keydown', function(e){
  if(lb.hidden) return;
  if(e.key==='Escape'){ shut(); return; }
  if(e.target && e.target.tagName==='VIDEO') return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); show(index-1); }
  if(e.key==='ArrowRight'){ e.preventDefault(); show(index+1); }
});
lb.addEventListener('pointerdown', function(e){
  if(e.target.closest('button')) return;
  startX=e.clientX; startY=e.clientY;
});
lb.addEventListener('pointerup', function(e){
  if(startX==null) return;
  var dx=e.clientX-startX, dy=e.clientY-startY;
  startX=null; startY=null;
  if(Math.abs(dx)<48 || Math.abs(dx)<Math.abs(dy)) return;
  if(e.target && e.target.tagName==='VIDEO' && Math.abs(dx)<80) return;
  show(index+(dx<0?1:-1));
});
function tile(item, i){
  var b=document.createElement('button');
  b.type='button';
  if(item.type==='video'){
    b.className='vid';
    var m=/video_(\d+)/.exec(item.file);
    b.id=m?'v-video_'+m[1]:'';
  }
  var img=document.createElement('img');
  img.loading='lazy';
  img.alt=item.caption|| (item.type==='video'?'Video':'Photo');
  if(item.type==='video') img.src=posterFor(item.file);
  else img.src='photos/'+item.thumb;
  b.appendChild(img);
  if(item.type==='video'){
    var badge=document.createElement('span'); badge.className='badge'; badge.textContent='VIDEO';
    var play=document.createElement('span'); play.className='play'; play.setAttribute('aria-hidden','true'); play.innerHTML='&#9654;';
    b.appendChild(badge); b.appendChild(play);
  }
  if(item.caption){
    var c=document.createElement('span'); c.className='tilecap'; c.textContent=item.caption;
    b.appendChild(c);
  }
  b.addEventListener('click', function(){ show(i); });
  return b;
}
fetch('photos/photos.json').then(function(r){ return r.json(); }).then(function(data){
  items=data;
  var photos=data.filter(function(it){ return it.type!=='video'; }).length;
  var videos=data.length-photos;
  var deck=document.getElementById('deck');
  if(deck) deck.textContent=photos+' photos and '+videos+' videos from the CSUSB geology field camp at the Silver King Mine, 24 March 2019. Select a picture to see it larger. Videos are marked VIDEO.';
  data.forEach(function(item, i){ grid.appendChild(tile(item, i)); });
  var h=location.hash||'';
  var byId=h.match(/^#v-video_(\d+)/);
  var byIndex=h.match(/^#i(\d+)/);
  if(byId){
    var want='videos/video_'+byId[1]+'.mp4';
    var found=items.findIndex(function(it){ return it.file===want; });
    if(found>=0) show(found);
  } else if(byIndex) show(+byIndex[1]);
}).catch(function(){
  grid.textContent='The photo list did not load. Please refresh the page.';
});
})();
</script>
</body></html>
