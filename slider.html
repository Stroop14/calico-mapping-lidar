<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>Then and Now · Silver King Mine, Calico</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;background:#050403;color:#e8d8c4;font-family:system-ui,Segoe UI,Helvetica,Arial,sans-serif}
body{padding:22px 16px 64px}
main{width:min(980px,100%);margin:0 auto}
a{color:#f0b27a}
.back{display:inline-block;margin:0 0 14px;padding:12px 16px;border:2px solid #e9a066;border-radius:10px;background:rgba(233,160,102,.12);color:#ffd2a6;font-size:18px;font-weight:750;text-decoration:none}
.back:hover{background:rgba(233,160,102,.24);color:#fff}
h1{margin:0 0 6px;font-size:clamp(28px,5vw,40px);font-weight:650;color:#f3c79a}
.deck{margin:0 0 22px;font-size:16px;line-height:1.45;max-width:68ch}
.pair{margin:0 0 36px}
.pair h2{margin:0 0 8px;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:#8f7a66;font-weight:650}
.ba{position:relative;overflow:hidden;border-radius:8px;border:1px solid #3a2a1e;background:#0a0705;touch-action:none;cursor:ew-resize;outline:none}
.ba:focus-visible{box-shadow:0 0 0 2px #e9a066}
.ba .now,.ba .old{display:block;width:100%;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.ba .clip{position:absolute;left:0;top:0;bottom:0;width:var(--pct,50%);overflow:hidden}
.ba .old{position:absolute;left:0;top:0;height:100%;max-width:none;width:auto}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--pct,50%);width:44px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center}
.ba .handle i{width:2px;height:100%;background:#f3c79a;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.ba .handle b{position:absolute;width:28px;height:28px;border-radius:50%;background:#e9a066;border:2px solid #1c1008}
.tag{position:absolute;top:10px;z-index:2;padding:4px 8px;border-radius:6px;background:rgba(5,4,3,.72);color:#ffd2a6;font:750 12px/1 system-ui,sans-serif;letter-spacing:.04em;pointer-events:none}
.tag.then{left:10px}
.tag.now{right:10px}
.ba.show-ov .clip,.ba.show-ov .handle,.ba.show-ov .tag{display:none}
.ba .ov{display:none;width:100%;height:auto}
.ba.show-ov .ov{display:block}
.ba.show-ov .now{display:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 0}
.toggle{appearance:none;cursor:pointer;background:rgba(10,7,5,.55);color:#ffd2a6;border:1px solid rgba(233,160,102,.75);border-radius:8px;padding:8px 12px;font:700 14px/1 system-ui,sans-serif}
.toggle[aria-pressed="true"]{background:rgba(233,160,102,.85);color:#1c1008}
.hint{font-size:13px;opacity:.75}
.cap{margin:8px 0 0;font-size:15.5px;line-height:1.45}
</style></head>
<body>
<main>
<a class="back" href="index.html">Back to the main page</a>
<h1>Then and Now</h1>
<p class="deck">Black-and-white prints from the Calico trip beside colour photos from 25 March 2019. Drag the line, or focus a photo and use the arrow keys.</p>
<div id="list"></div>
</main>
<script>
(function(){
'use strict';
var PAIRS=[
 {id:'pair01',w:1600,h:930,
  cap:'Looking down a small wash toward the valley, with steeply tilted rock layers on the right. The colour photo is from the top of a wooden walkway; the lamp pole and walkway are not in the print.'},
 {id:'pair02',w:1600,h:913,
  cap:'Elevated view over the Calico buildings toward the tilted rock ridge and the valley beyond. The old frame is a black-and-white print; the new one is a colour photo from the ghost-town overlook.'},
 {id:'pair03',w:1600,h:1273,
  cap:'Overlook with a dark foreground rock and a small opening at its top, buildings below, and the valley and distant mountains. Old: black-and-white print. New: colour photo from the ghost-town overlook.'},
 {id:'pair04',w:1600,h:1012,
  cap:'The Maggie Mine building against a rocky hillside, with a wooden headframe behind it. The old print shows signs for Maggie Mining Co., Glory Tunnel and Commissary, two ore carts, and a man standing at the right. The colour photo shows the building with its current sign, rail track and fence.'}
];
var list=document.getElementById('list');
function layout(ba){
  var img=ba.querySelector('.old');
  img.style.width=ba.clientWidth+'px';
}
function setSplit(ba, pct){
  pct=Math.max(0, Math.min(100, pct));
  ba.style.setProperty('--pct', pct+'%');
  ba.setAttribute('aria-valuenow', String(Math.round(pct)));
  layout(ba);
}
function fromEvent(ba, e){
  var r=ba.getBoundingClientRect();
  setSplit(ba, (e.clientX-r.left)/Math.max(1,r.width)*100);
}
PAIRS.forEach(function(p, n){
  var sec=document.createElement('section');
  sec.className='pair';
  sec.innerHTML=
    '<h2>Pair '+(n+1)+'</h2>'+
    '<div class="ba" tabindex="0" role="slider" aria-label="Then and now, pair '+(n+1)+'" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">'+
      '<img class="now" alt="" width="'+p.w+'" height="'+p.h+'" src="assets/pairs/'+p.id+'_new.jpg">'+
      '<div class="clip"><img class="old" alt="Then: black-and-white print. Now: colour photo." width="'+p.w+'" height="'+p.h+'" src="assets/pairs/'+p.id+'_old.jpg"></div>'+
      '<img class="ov" alt="50/50 overlay of the print and the colour photo" width="'+p.w+'" height="'+p.h+'">'+
      '<span class="tag then">Then</span><span class="tag now">Now</span>'+
      '<div class="handle" aria-hidden="true"><i></i><b></b></div>'+
    '</div>'+
    '<div class="row"><button type="button" class="toggle" aria-pressed="false">Show 50/50 overlay</button><span class="hint">Drag or use arrow keys</span></div>'+
    '<p class="cap"></p>';
  sec.querySelector('.cap').textContent=p.cap;
  var ba=sec.querySelector('.ba');
  var ov=ba.querySelector('.ov');
  var btn=sec.querySelector('.toggle');
  ba.addEventListener('pointerdown', function(e){
    if(ba.classList.contains('show-ov')) return;
    ba.setPointerCapture(e.pointerId);
    fromEvent(ba, e);
  });
  ba.addEventListener('pointermove', function(e){
    if(!ba.hasPointerCapture(e.pointerId)) return;
    fromEvent(ba, e);
  });
  ba.addEventListener('keydown', function(e){
    if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
    e.preventDefault();
    var cur=parseFloat(ba.getAttribute('aria-valuenow'))||50;
    setSplit(ba, cur+(e.key==='ArrowLeft'?-4:4));
  });
  btn.addEventListener('click', function(){
    var on=btn.getAttribute('aria-pressed')!=='true';
    btn.setAttribute('aria-pressed', on?'true':'false');
    btn.textContent=on?'Show the slider':'Show 50/50 overlay';
    ba.classList.toggle('show-ov', on);
    if(on && !ov.getAttribute('src')) ov.src='assets/pairs/'+p.id+'_overlay.jpg';
  });
  list.appendChild(sec);
  setSplit(ba, 50);
  var now=ba.querySelector('.now');
  if(now.complete) layout(ba);
  else now.addEventListener('load', function(){ layout(ba); });
});
addEventListener('resize', function(){
  document.querySelectorAll('.ba').forEach(layout);
});
})();
</script>
</body></html>
