<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mine walk</title>
<style>
html,body{margin:0;height:100%;background:#050403;overflow:hidden;color:#f0d2b0;font:14px/1.45 system-ui,Segoe UI,Helvetica,Arial,sans-serif}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:rgba(10,7,5,.6)}
#bar span{flex:1 1 160px}
button{background:transparent;color:inherit;border:1px solid rgba(240,210,176,.45);border-radius:4px;padding:4px 10px;font:inherit}
button:disabled{opacity:.35}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#endsHint{position:fixed;left:12px;right:12px;top:58px;z-index:3;text-align:center;pointer-events:none;font-weight:700;text-shadow:0 1px 2px #000}
</style>
</head>
<body>
<div id="err">Loading the cloud…</div>
<div id="bar" hidden>
  <span id="info"></span>
  <button type="button" id="mark">Key point</button>
  <button type="button" id="undo">Undo</button>
  <button type="button" id="savewalk">Save the walk</button>
  <button type="button" id="play" disabled>Play</button>
  <button type="button" id="rev">Reverse</button>
  <button type="button" id="lamp">Lamp</button>
</div>
<div id="endsHint">Walk a distance, then press Key point. Walk farther, press Key point again. At the end, press Save the walk.</div>
<script src="three.min.js"></script>
<script src="cloud.js"></script>
<script>
(function () {
  var err = document.getElementById('err');
  if (!window.THREE) { err.textContent = 'three.js did not load next to this page.'; return; }
  if (!window.CLOUD || !CLOUD.tone || !CLOUD.nrm) {
    err.textContent = 'cloud.js is missing the walk data. Run make_walk.py again.';
    return;
  }
  var C = CLOUD;
  var phone = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window);
  var qualityHigh = !phone;

  function b64(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function rgb(c) { return new THREE.Vector3(c[0] / 255, c[1] / 255, c[2] / 255); }
  var xyz = new Float32Array(b64(C.xyz).buffer);
  var toneAll = b64(C.tone);
  var nrmAll = new Int8Array(b64(C.nrm).buffer);
  var nAll = xyz.length / 3;

  function keepPoint(i) {
    if (qualityHigh) return true;
    if (nrmAll[3 * i + 1] > 48) return true;
    var h = (Math.imul(i, 374761393) ^ Math.imul(i + 1, 668265263)) >>> 0;
    return (h % 5) < 2;
  }
  var keep = [];
  for (var i = 0; i < nAll; i++) if (keepPoint(i)) keep.push(i);
  var n = keep.length;
  var pos = new Float32Array(n * 3);
  var tone = new Uint8Array(n);
  var nrm = new Int8Array(n * 3);
  for (var k = 0; k < n; k++) {
    var i = keep[k];
    pos[k * 3] = xyz[i * 3]; pos[k * 3 + 1] = xyz[i * 3 + 1]; pos[k * 3 + 2] = xyz[i * 3 + 2];
    tone[k] = toneAll[i];
    nrm[k * 3] = nrmAll[i * 3]; nrm[k * 3 + 1] = nrmAll[i * 3 + 1]; nrm[k * 3 + 2] = nrmAll[i * 3 + 2];
  }

  var renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x050403, 1);
  document.body.appendChild(renderer.domElement);
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 800);
  camera.rotation.order = 'YXZ';

  var U = {
    uCam: { value: new THREE.Vector3() },
    uDir: { value: new THREE.Vector3(0, 0, -1) },
    uLamp: { value: 1.0 },
    uSize: { value: qualityHigh ? 0.03 : 0.045 },
    uMinPx: { value: qualityHigh ? 1.0 : 2.2 },
    uMaxPx: { value: qualityHigh ? 30.0 : 40.0 },
    uScreen: { value: innerHeight * renderer.getPixelRatio() },
    uFov: { value: Math.tan(THREE.MathUtils.degToRad(36)) * 2 },
    uTime: { value: 0 },
    uFogDist: { value: 38.0 },
    uCull: { value: 1.0 },
    uGrade: { value: 0.0 },
    uFloor: { value: rgb(C.floor) },
    uLow: { value: rgb(C.low || C.floor) },
    uWall: { value: rgb(C.wall) },
    uCeil: { value: rgb(C.ceil) }
  };
  var common = [
    'uniform vec3 uCam; uniform vec3 uDir; uniform float uLamp; uniform float uTime; uniform float uFogDist;',
    'uniform vec3 uFloor; uniform vec3 uWall; uniform vec3 uLow; uniform vec3 uCeil;',
    'float h3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}',
    'float vnoise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.0-2.0*f);',
    ' return mix(mix(mix(h3(i),h3(i+vec3(1,0,0)),f.x),mix(h3(i+vec3(0,1,0)),h3(i+vec3(1,1,0)),f.x),f.y),',
    '            mix(mix(h3(i+vec3(0,0,1)),h3(i+vec3(1,0,1)),f.x),mix(h3(i+vec3(0,1,1)),h3(i+vec3(1,1,1)),f.x),f.y),f.z);}',
    'vec3 clayColor(vec3 wp, vec3 n, float hgt, float mat){',
    ' float n1=vnoise(wp*1.1), n2=vnoise(wp*4.3), n3=vnoise(wp*17.0);',
    ' vec3 ceilc=uCeil, wallc=uWall, lowc=uLow, floorc=uFloor;',
    ' vec3 c=mix(lowc,wallc,smoothstep(0.25,1.1,hgt)); c=mix(c,ceilc,smoothstep(1.0,1.9,hgt));',
    ' c=mix(c,vec3(0.80,0.52,0.26),smoothstep(0.55,0.85,n1)*0.55);',
    ' c=mix(c,vec3(0.82,0.68,0.55),smoothstep(0.62,0.9,n2)*0.30);',
    ' c=mix(c,vec3(0.66,0.30,0.24),smoothstep(0.6,0.95,1.0-n1)*0.40);',
    ' float isFloor=(1.0-smoothstep(0.08,0.2,hgt))*smoothstep(0.55,0.8,abs(n.y));',
    ' c=mix(c,floorc*(0.85+0.3*n2),isFloor);',
    ' if(mat>0.955 && mat<0.985) c=vec3(0.36,0.24,0.14)*(0.7+0.6*n3);',
    ' if(mat>0.985) c=vec3(0.56,0.34,0.25)*(0.8+0.4*n2);',
    ' c*=0.86+0.28*n3; c=mix(vec3(dot(c,vec3(0.33))),c,1.35);',
    ' return c;}',
    'vec3 light(vec3 wp, vec3 n, vec3 base){',
    ' vec3 toC=uCam-wp; float d=length(toC); vec3 L=toC/max(d,1e-4);',
    ' float ndl=abs(dot(n,L));',
    ' float cs=dot(-L,uDir);',
    ' float cone=smoothstep(0.80,0.975,cs);',
    ' float spill=smoothstep(0.35,0.85,cs);',
    ' float att=1.0/(1.0+0.25*d+0.10*d*d);',
    ' float lamp=(0.05+1.5*cone+0.3*spill)*att*(0.15+0.85*ndl*ndl);',
    ' float amb=0.012+0.02*max(n.y,0.0);',
    ' float li=mix(0.55*(0.35+0.65*ndl)*(1.0/(1.0+0.004*d*d))+0.1, lamp+amb, uLamp);',
    ' vec3 col=base*li*mix(vec3(1.0),vec3(1.07,1.0,0.88),uLamp);',
    ' float fog=exp(-pow(d/uFogDist,2.0)*2.2);',
    ' return col*fog;}'
  ].join('\n');
  var mat = new THREE.ShaderMaterial({
    uniforms: U,
    vertexShader: common + [
      'attribute vec3 nrm; attribute float tone;',
      'uniform float uSize; uniform float uMinPx; uniform float uMaxPx; uniform float uScreen; uniform float uFov; uniform float uCull;',
      'varying vec3 vCol;',
      'void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vec4 mv=viewMatrix*wp;',
      ' float hgt=tone*2.6/0.902; if(tone>0.95) hgt=1.0;',
      ' vec3 base=clayColor(wp.xyz,nrm,hgt,tone);',
      ' vCol=light(wp.xyz,nrm,base);',
      ' gl_Position=projectionMatrix*mv;',
      ' float sz=uSize*(tone>0.985?0.6:1.0);',
      ' gl_PointSize=clamp(sz*uScreen/(uFov*-mv.z),uMinPx,uMaxPx);',
      ' if(uCull>0.5 && tone<0.95 && dot(nrm,normalize(uCam-wp.xyz))<-0.3){gl_Position=vec4(2.0,2.0,2.0,1.0);gl_PointSize=0.0;}}'
    ].join('\n'),
    fragmentShader: [
      'uniform float uGrade; varying vec3 vCol;',
      'vec3 gradeClay(vec3 c){',
      ' vec3 warm=c*vec3(1.035,1.005,0.975);',
      ' float y=dot(warm,vec3(0.30,0.59,0.11));',
      ' vec3 sat=mix(vec3(y),warm,1.10);',
      ' vec3 con=(sat-y)*1.05+y;',
      ' float clay=smoothstep(0.02,0.22,con.r-con.b);',
      ' con.r+=0.018*clay; con.g+=0.005*clay;',
      ' return max(con,vec3(0.0));}',
      'void main(){ vec2 q=gl_PointCoord-0.5; if(dot(q,q)>0.25) discard;',
      ' float lm=dot(vCol,vec3(0.3,0.55,0.15)); vec3 col=vCol*(1.9/(1.0+1.9*lm*0.75));',
      ' col=mix(col,gradeClay(col),uGrade);',
      ' gl_FragColor=vec4(pow(max(col,vec3(0.0)),vec3(1.0/2.2)),1.0);}'
    ].join('\n')
  });
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('nrm', new THREE.BufferAttribute(nrm, 3, true));
  geo.setAttribute('tone', new THREE.BufferAttribute(tone, 1, true));
  var cloud = new THREE.Points(geo, mat);
  scene.add(cloud);
  var markGeo = new THREE.BufferGeometry();
  markGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(3), 3));
  markGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(3), 3));
  var markPts = new THREE.Points(markGeo, new THREE.ShaderMaterial({
    depthTest: false,
    vertexShader: 'attribute vec3 color; varying vec3 vC; void main(){ vC=color; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_PointSize=18.0; }',
    fragmentShader: 'varying vec3 vC; void main(){ vec2 q=gl_PointCoord-0.5; if(dot(q,q)>0.25) discard; gl_FragColor=vec4(vC,1.0); }'
  }));
  markPts.renderOrder = 2;
  markPts.frustumCulled = false;
  markPts.visible = false;
  scene.add(markPts);

  var path = C.path.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); });
  var saved = C.saved !== false && path.length >= 2;
  var published = saved;
  var spots = [];
  if (saved) for (var si = 0; si < path.length; si++) spots.push(path[si].clone());
  function station(s) {
    if (s <= 0) return path[0].clone();
    var acc = 0;
    for (var i = 0; i < path.length - 1; i++) {
      var seg = path[i].distanceTo(path[i + 1]);
      if (acc + seg >= s) return path[i].clone().lerp(path[i + 1], (s - acc) / Math.max(seg, 1e-4));
      acc += seg;
    }
    return path[path.length - 1].clone();
  }
  var pathLen = 0;
  function measurePath() {
    pathLen = 0;
    for (var pi = 0; pi < path.length - 1; pi++) pathLen += path[pi].distanceTo(path[pi + 1]);
    if (window.WALK) {
      window.WALK.pathLen = pathLen;
      window.WALK.saved = saved;
      window.WALK.spots = spots.length;
      var rows = [];
      for (var ri = 0; ri < path.length; ri++) rows.push([path[ri].x, path[ri].y, path[ri].z]);
      window.WALK.path = rows;
    }
  }
  measurePath();
  var along = 0, playing = false, yaw = 0, pitch = -0.08, lampOn = true;
  var hint = document.getElementById('endsHint');
  function refreshMarks() {
    var n = spots.length;
    var pos = new Float32Array(Math.max(n, 1) * 3);
    var col = new Float32Array(Math.max(n, 1) * 3);
    for (var i = 0; i < n; i++) {
      pos[i * 3] = spots[i].x;
      pos[i * 3 + 1] = spots[i].y;
      pos[i * 3 + 2] = spots[i].z;
      var hex = 0xf7e1c2;
      if (i === 0) hex = 0xf0b27a;
      else if (i === n - 1) hex = 0x9ad7a0;
      col[i * 3] = ((hex >> 16) & 255) / 255;
      col[i * 3 + 1] = ((hex >> 8) & 255) / 255;
      col[i * 3 + 2] = (hex & 255) / 255;
    }
    markGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    markGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    markGeo.setDrawRange(0, n);
    markPts.visible = n > 0;
  }
  function eyeHere() {
    var x = camera.position.x, z = camera.position.z;
    var arr = geo.attributes.position.array;
    var ys = [];
    for (var i = 0; i < arr.length; i += 3) {
      var dx = arr[i] - x, dz = arr[i + 2] - z;
      if (dx * dx + dz * dz > 9) continue;
      ys.push(arr[i + 1]);
    }
    var y = camera.position.y;
    if (ys.length >= 8) {
      ys.sort(function (a, b) { return a - b; });
      y = ys[Math.min(ys.length - 1, Math.floor(0.08 * (ys.length - 1)))] + 1.6;
    }
    return new THREE.Vector3(x, y, z);
  }
  function put(s, lookAhead) {
    var p = station(s), a = station(Math.min(pathLen, s + lookAhead));
    camera.position.copy(p);
    var dx = a.x - p.x, dy = a.y - p.y, dz = a.z - p.z;
    yaw = Math.atan2(-dx, -dz);
    pitch = Math.atan2(dy, Math.hypot(dx, dz));
    camera.rotation.set(pitch, yaw, 0);
  }
  put(0, 2);

  var keys = {}, look = false, stickX = 0, stickY = 0;
  var bar = document.getElementById('bar'), info = document.getElementById('info');
  function pts(n) {
    if (n >= 1000000) return (n / 1e6).toFixed(2) + ' M';
    return n.toLocaleString();
  }
  var playBtn = document.getElementById('play');
  if (published) {
    document.getElementById('mark').hidden = true;
    document.getElementById('undo').hidden = true;
    document.getElementById('savewalk').hidden = true;
    playBtn.disabled = false;
  }
  function paint() {
    err.hidden = true; bar.hidden = false;
    info.textContent = (qualityHigh ? 'desktop' : 'phone') + ' · ' + pts(nAll) + ' points'
      + (qualityHigh ? '' : ' · ' + pts(n) + ' on screen')
      + ' · ' + (lampOn ? 'headlamp' : 'flat light')
      + ' · ' + (saved ? 'walk saved' : spots.length + (spots.length === 1 ? ' key point' : ' key points'));
    if (published) hint.textContent = 'Press Play to view the walk. The orange dot is the first key point. The green dot is the last.';
    else if (!spots.length) hint.textContent = 'Walk a distance, then press Key point.';
    else if (spots.length === 1) hint.textContent = 'Walk a distance, then press Key point again.';
    else if (!saved) hint.textContent = 'Keep going. At the end, when the key points are done, press Save the walk.';
    else hint.textContent = 'Walk saved. Press Play to view it here. Then download the site.';
  }
  refreshMarks();
  paint();
  playBtn.onclick = function () {
    if (!saved) return;
    playing = !playing;
    this.textContent = playing ? 'Stop' : 'Play';
    paint();
  };
  document.getElementById('rev').onclick = function () {
    if (spots.length > 1) spots.reverse();
    if (saved && spots.length > 1) {
      path = spots.map(function (p) { return p.clone(); });
      along = 0;
      measurePath();
      put(0, 2);
    }
    refreshMarks();
    paint();
  };
  document.getElementById('mark').onclick = function () {
    playing = false;
    playBtn.textContent = 'Play';
    var p = eyeHere();
    if (spots.length && spots[spots.length - 1].distanceTo(p) < 0.4) {
      hint.textContent = 'Walk a bit farther, then press Key point.';
      return;
    }
    spots.push(p);
    saved = false;
    playBtn.disabled = true;
    refreshMarks();
    paint();
    if (window.WALK) { window.WALK.saved = false; window.WALK.spots = spots.length; }
  };
  document.getElementById('undo').onclick = function () {
    if (!spots.length) return;
    spots.pop();
    saved = false;
    playBtn.disabled = true;
    refreshMarks();
    paint();
    if (window.WALK) { window.WALK.saved = false; window.WALK.spots = spots.length; }
  };
  document.getElementById('savewalk').onclick = function () {
    if (spots.length < 2) {
      hint.textContent = 'Mark where you are. Walk a distance. Mark the next key point. Then save.';
      return;
    }
    path = spots.map(function (p) { return p.clone(); });
    saved = true;
    along = 0;
    playing = false;
    playBtn.textContent = 'Play';
    playBtn.disabled = false;
    measurePath();
    put(0, 2);
    refreshMarks();
    paint();
  };
  document.getElementById('lamp').onclick = function () { lampOn = !lampOn; paint(); };
  addEventListener('keydown', function (e) {
    keys[e.code] = true;
    if (e.code === 'KeyP') document.getElementById('play').click();
    if (e.code === 'KeyL') document.getElementById('lamp').click();
    if (e.code === 'BracketLeft') U.uSize.value = Math.max(0.005, U.uSize.value / 1.15);
    if (e.code === 'BracketRight') U.uSize.value = Math.min(0.4, U.uSize.value * 1.15);
  });
  addEventListener('keyup', function (e) { keys[e.code] = false; });
  renderer.domElement.addEventListener('click', function () {
    if (!phone) renderer.domElement.requestPointerLock();
  });
  document.addEventListener('pointerlockchange', function () { look = document.pointerLockElement === renderer.domElement; });
  document.addEventListener('mousemove', function (e) {
    if (!look || playing) return;
    yaw -= e.movementX * 0.0022;
    pitch = Math.max(-1.4, Math.min(1.4, pitch - e.movementY * 0.0022));
    camera.rotation.set(pitch, yaw, 0);
  });
  var moveId = null, lookId = null, ox = 0, oy = 0, lx = 0, ly = 0;
  function touchOf(list, id) { for (var i = 0; i < list.length; i++) if (list[i].identifier === id) return list[i]; }
  renderer.domElement.addEventListener('touchstart', function (e) {
    playing = false; document.getElementById('play').textContent = 'Play';
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      if (t.clientX < innerWidth * 0.45 && moveId === null) { moveId = t.identifier; ox = t.clientX; oy = t.clientY; }
      else if (lookId === null) { lookId = t.identifier; lx = t.clientX; ly = t.clientY; }
    }
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', function (e) {
    var t = touchOf(e.changedTouches, moveId);
    if (t) { stickX = Math.max(-1, Math.min(1, (t.clientX - ox) / 70)); stickY = Math.max(-1, Math.min(1, (t.clientY - oy) / 70)); }
    t = touchOf(e.changedTouches, lookId);
    if (t) {
      yaw -= (t.clientX - lx) * 0.005;
      pitch = Math.max(-1.4, Math.min(1.4, pitch - (t.clientY - ly) * 0.005));
      lx = t.clientX; ly = t.clientY;
      camera.rotation.set(pitch, yaw, 0);
    }
  }, { passive: true });
  function endTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) {
      var id = e.changedTouches[i].identifier;
      if (id === moveId) { moveId = null; stickX = stickY = 0; }
      if (id === lookId) lookId = null;
    }
  }
  renderer.domElement.addEventListener('touchend', endTouch);
  renderer.domElement.addEventListener('touchcancel', endTouch);
  function resize() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    U.uScreen.value = innerHeight * renderer.getPixelRatio();
    U.uFov.value = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * 2;
  }
  addEventListener('resize', resize);
  resize();

  var clock = new THREE.Clock();
  function frame() {
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, clock.getDelta());
    U.uTime.value += dt;
    if (playing) {
      along += 1.2 * dt;
      if (along >= pathLen) { along = pathLen; playing = false; document.getElementById('play').textContent = 'Play'; }
      put(along, 2.5);
    } else {
      var f = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      var r = new THREE.Vector3().crossVectors(f, new THREE.Vector3(0, 1, 0)).normalize();
      var m = new THREE.Vector3();
      if (keys.KeyW || keys.ArrowUp) m.add(f);
      if (keys.KeyS || keys.ArrowDown) m.sub(f);
      if (keys.KeyD || keys.ArrowRight) m.add(r);
      if (keys.KeyA || keys.ArrowLeft) m.sub(r);
      if (stickX || stickY) { m.addScaledVector(f, -stickY); m.addScaledVector(r, stickX); }
      if (m.lengthSq()) camera.position.addScaledVector(m.normalize(), 2 * dt);
    }
    U.uCam.value.copy(camera.position);
    camera.updateMatrixWorld();
    var d = new THREE.Vector3();
    camera.getWorldDirection(d);
    d.y -= 0.08;
    d.normalize();
    U.uDir.value.copy(d);
    U.uLamp.value += ((lampOn ? 1 : 0) - U.uLamp.value) * Math.min(1, dt * 8 + (dt === 0 ? 1 : 0));
    U.uFogDist.value = lampOn ? 38 : 80;
    renderer.render(scene, camera);
  }
  frame();
  function setColors(colors) {
    function use(key, uni) {
      var c = colors[key];
      if (!c) return;
      uni.value.set(c[0] / 255, c[1] / 255, c[2] / 255);
      C[key] = c;
    }
    use('floor', U.uFloor); use('low', U.uLow); use('wall', U.uWall); use('ceil', U.uCeil);
    window.WALK.floor = C.floor; window.WALK.wall = C.wall; window.WALK.ceil = C.ceil;
  }
